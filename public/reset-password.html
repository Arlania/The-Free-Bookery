<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a New Password | Free Bookery</title>
    <link rel="icon" type="image/png" href="assets/book-logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="reset-password-title">
        <a class="brand" href="index.html"><img src="assets/book-logo.png" alt="" class="brand-logo" /><span>Free Bookery</span></a>
        <h1 id="reset-password-title">Choose a new password</h1>
        <form class="signin-form" data-auth-flow-form="reset-password">
          <label for="reset-password">New password</label>
          <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
          <label for="reset-password-confirmation">Confirm new password</label>
          <input id="reset-password-confirmation" name="password-confirmation" type="password" autocomplete="new-password" minlength="8" required />
          <p class="signin-message" data-auth-flow-message role="status" aria-live="polite"></p>
          <button type="submit">Reset password</button>
        </form>
        <p class="auth-login-prompt"><a href="index.html#signin">Return to login</a></p>
      </section>
    </main>
    <script src="auth-flows.js"></script>
  </body>
</html>
