<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Book Requests | Free Bookery Admin</title><link rel="icon" type="image/png" href="assets/book-logo.png" /><link rel="stylesheet" href="styles.css" /></head>
  <body class="account-feed-body">
    <header class="site-header"><nav class="nav-left" aria-label="Primary navigation"><a href="blog.html">Blog</a><a href="index.html#about">About Us</a></nav><a class="brand" href="index.html" aria-label="Free Bookery home"><img src="assets/book-logo.png" alt="" class="brand-logo" /><span>Free Bookery</span></a><nav class="nav-right" aria-label="Account navigation"><a href="donate.html">Donate</a><a href="index.html#signin" class="login-link">Login/Sign up</a><div class="user-menu" hidden><button class="user-button" type="button" aria-label="User account menu" aria-haspopup="true" aria-expanded="false"><span class="user-icon" aria-hidden="true"></span><span class="user-name">Free Bookery</span></button><div class="account-dropdown" role="menu"><a href="collections.html" role="menuitem">Collections</a><a href="creator-access.html" role="menuitem">Creator Access</a><a href="contact.html" role="menuitem">Contact Us</a><button class="logout-button" type="button" role="menuitem">Sign Out</button></div></div></nav></header>
    <main class="account-feed-page">
      <header class="account-feed-heading"><div><p class="creator-eyebrow">Admin workspace</p><h1>Book requests</h1><p>Research reader requests and keep each reader informed.</p></div><button type="button" data-admin-request-refresh>Refresh</button></header>
      <form class="activity-filters" data-admin-request-filters><label>Search <input name="query" type="search" maxlength="200" placeholder="Title, author, ISBN, or reader" /></label><label>Status <select name="status"><option value="">All statuses</option><option value="pending">Pending</option><option value="researching">Researching</option><option value="contacting">Contacting</option><option value="acquired">Acquired</option><option value="fulfilled">Fulfilled</option><option value="unavailable">Unavailable</option><option value="rejected">Rejected</option><option value="canceled">Canceled</option></select></label><button type="submit">Apply filters</button></form>
      <p data-admin-request-message role="status" aria-live="polite">Loading requests…</p>
      <section class="admin-request-list" data-admin-request-list></section>
      <nav class="feed-pagination" aria-label="Request pages"><button type="button" data-admin-request-previous>Previous</button><span data-admin-request-page>Page 1</span><button type="button" data-admin-request-next>Next</button></nav>
    </main>
    <script src="script.js"></script><script src="admin-book-requests.js"></script>
  </body>
</html>
