<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Free Bookery</title>
    <link rel="icon" type="image/png" href="assets/book-logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="forgot-password-title">
        <a class="brand" href="index.html"><img src="assets/book-logo.png" alt="" class="brand-logo" /><span>Free Bookery</span></a>
        <h1 id="forgot-password-title">Reset your password</h1>
        <p>Enter your account email and we’ll send a secure reset link.</p>
        <form class="signin-form" data-auth-flow-form="forgot-password">
          <label for="forgot-email">Email</label>
          <input id="forgot-email" name="email" type="email" autocomplete="email" required />
          <p class="signin-message" data-auth-flow-message role="status" aria-live="polite"></p>
          <button type="submit">Send reset link</button>
        </form>
        <p class="auth-login-prompt"><a href="index.html#signin">Return to login</a></p>
      </section>
    </main>
    <script src="auth-flows.js"></script>
  </body>
</html>
