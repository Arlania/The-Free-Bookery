<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications | Free Bookery</title>
    <link rel="icon" type="image/png" href="assets/book-logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="account-feed-body">
    <header class="site-header">
      <nav class="nav-left" aria-label="Primary navigation"><a href="blog.html">Blog</a><a href="index.html#about">About Us</a></nav>
      <a class="brand" href="index.html" aria-label="Free Bookery home">
        <img src="assets/book-logo.png" alt="" class="brand-logo" />
        <span>Free Bookery</span>
      </a>
      <nav class="nav-right" aria-label="Account navigation"><a href="donate.html">Donate</a><a href="index.html#signin" class="login-link">Login/Sign up</a><div class="user-menu" hidden><button class="user-button" type="button" aria-label="User account menu" aria-haspopup="true" aria-expanded="false"><span class="user-icon" aria-hidden="true"></span><span class="user-name">Free Bookery</span></button><div class="account-dropdown" role="menu"><a href="collections.html" role="menuitem">Collections</a><a href="creator-access.html" role="menuitem">Creator Access</a><a href="contact.html" role="menuitem">Contact Us</a><button class="logout-button" type="button" role="menuitem">Sign Out</button></div></div></nav>
    </header>
    <main class="account-feed-page">
      <header class="account-feed-heading">
        <div>
          <p class="creator-eyebrow">Your account</p>
          <h1>Notifications</h1>
          <p>Creator applications, book reviews, and other important updates.</p>
        </div>
        <button type="button" data-notifications-read-all>Mark all as read</button>
      </header>
      <div class="account-feed-toolbar">
        <label><input type="checkbox" data-notifications-unread /> Unread only</label>
        <p data-notifications-message role="status" aria-live="polite">Loading notifications…</p>
      </div>
      <section class="notification-list" data-notification-list aria-label="Notifications"></section>
      <nav class="feed-pagination" aria-label="Notification pages">
        <button type="button" data-notifications-previous>Previous</button>
        <span data-notifications-page>Page 1</span>
        <button type="button" data-notifications-next>Next</button>
      </nav>
    </main>
    <script src="script.js"></script><script src="notifications.js"></script>
  </body>
</html>
