<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submissions | Free Bookery Admin</title>
    <link rel="icon" type="image/png" href="assets/book-logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-submissions-body">
    <header class="site-header">
      <nav class="nav-left" aria-label="Primary navigation"><a href="blog.html">Blog</a><a href="index.html#about">About Us</a></nav>
      <a class="brand" href="index.html" aria-label="Free Bookery home">
        <img src="assets/book-logo.png" alt="" class="brand-logo" />
        <span>Free Bookery</span>
      </a>
      <nav class="nav-right" aria-label="Account navigation"><a href="donate.html">Donate</a><a href="index.html#signin" class="login-link">Login/Sign up</a><div class="user-menu" hidden><button class="user-button" type="button" aria-label="User account menu" aria-haspopup="true" aria-expanded="false"><span class="user-icon" aria-hidden="true"></span><span class="user-name">Free Bookery</span></button><div class="account-dropdown" role="menu"><a href="collections.html" role="menuitem">Collections</a><a href="creator-access.html" role="menuitem">Creator Access</a><a href="contact.html" role="menuitem">Contact Us</a><button class="logout-button" type="button" role="menuitem">Sign Out</button></div></div></nav>
    </header>
    <main class="admin-submissions-page">
      <header class="admin-submissions-heading">
        <div><p class="creator-eyebrow">Admin workspace</p><h1>Creator submissions</h1></div>
        <button type="button" data-admin-refresh>Refresh</button>
      </header>
      <p class="admin-submissions-message" data-admin-message role="status" aria-live="polite">Loading submissions…</p>
      <section class="admin-submissions-layout" hidden data-admin-workspace>
        <div class="admin-submission-list" data-admin-list aria-label="Pending submissions"></div>
        <article class="admin-submission-detail" data-admin-detail>
          <div class="admin-submission-empty">Select a submission to review its details.</div>
        </article>
      </section>
    </main>
    <script src="script.js"></script><script src="admin-submissions.js"></script>
  </body>
</html>
