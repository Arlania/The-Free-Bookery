<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Write Blog | Free Bookery</title><link rel="icon" type="image/png" href="assets/book-logo.png" /><link rel="stylesheet" href="styles.css" /></head><body class="account-feed-body">
<header class="site-header"><nav class="nav-left" aria-label="Primary navigation"><a href="blog.html">Blog</a><a href="index.html#about">About Us</a></nav><a class="brand" href="index.html" aria-label="Free Bookery home"><img src="assets/book-logo.png" alt="" class="brand-logo" /><span>Free Bookery</span></a><nav class="nav-right" aria-label="Account navigation"><a href="donate.html">Donate</a><a href="index.html#signin" class="login-link">Login/Sign up</a><div class="user-menu" hidden><button class="user-button" type="button" aria-label="User account menu" aria-haspopup="true" aria-expanded="false"><span class="user-icon" aria-hidden="true"></span><span class="user-name">Free Bookery</span></button><div class="account-dropdown" role="menu"><button class="logout-button" type="button" role="menuitem">Sign Out</button></div></div></nav></header>
<main class="account-feed-page"><header class="account-feed-heading"><div><p class="creator-eyebrow">Author workspace</p><h1>Write blog</h1><p>Send a blog post to the Free Bookery team for review.</p></div></header><section class="request-form-panel"><form class="content-publish-form" data-author-blog-form><label>Title <input name="title" maxlength="220" required /></label><label>Category <select name="category"><option>Author Notes</option><option>Book Recommendations</option><option>Reading Life</option><option>Writing Advice</option><option>Behind the Book</option><option>New Releases</option><option>Creator Spotlight</option><option>Community Stories</option></select></label><label class="content-form-wide">Summary <input name="summary" maxlength="500" placeholder="Optional short introduction" /></label><label class="content-form-wide">Post <textarea name="body" rows="12" maxlength="20000" required></textarea></label><p data-author-blog-message role="status" aria-live="polite"></p><button type="submit">Submit for review</button></form></section><section class="request-history"><h2>Your submissions</h2><div class="blog-review-list" data-author-blog-list></div></section></main><script src="script.js"></script><script src="author-blog.js"></script></body></html>
