<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Books | Free Bookery</title>
    <link rel="icon" type="image/png" href="assets/book-logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav-left" aria-label="Primary navigation">
        <a href="blog.html">Blog</a>
        <a href="index.html#about">About Us</a>
      </nav>

      <a class="brand" href="index.html" aria-label="Free Bookery home">
        <img src="assets/book-logo.png" alt="" class="brand-logo" />
        <span>Free Bookery</span>
      </a>

      <nav class="nav-right" aria-label="Account navigation">
        <a href="index.html#donate">Donate</a>
        <a href="index.html#signin" class="login-link">Login/Sign up</a>
        <div class="user-menu" hidden>
          <button
            class="user-button"
            type="button"
            aria-label="User account menu"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <span class="user-icon" aria-hidden="true"></span>
            <span class="user-name">Free Bookery</span>
          </button>
          <div class="account-dropdown" role="menu">
            <a href="#starred" role="menuitem">Starred</a>
            <a href="collections.html" role="menuitem">Collections</a>
            <a href="#creator-access" role="menuitem">Creator Access</a>
            <a href="contact.html" role="menuitem">Contact Us</a>
            <button class="logout-button" type="button" role="menuitem">
              Sign Out
            </button>
          </div>
        </div>
      </nav>
    </header>

    <main class="search-page">
      <section class="search-card" aria-labelledby="search-title">
        <h1 id="search-title">Search</h1>
        <p>
          Look for novels, manga, cookbooks, academic papers, and other digital
          books
        </p>

        <form class="book-search-form">
          <label for="book-search">Book title, author, ISBN, or DOI</label>
          <div class="search-row">
            <input
              id="book-search"
              name="query"
              type="search"
              placeholder="Search..."
              required
            />
            <button type="submit">Search</button>
          </div>

        </form>

        <section
          class="search-results"
          aria-labelledby="search-results-title"
          aria-live="polite"
          hidden
        >
          <div class="search-results-banner">
            <p class="search-results-count"></p>
            <h2 id="search-results-title">Search Results</h2>
          </div>

          <p class="search-status"></p>
          <div class="search-results-grid"></div>
        </section>

        <div class="recent-searches" aria-labelledby="recent-searches-title">
          <h2 id="recent-searches-title">Recent Searches</h2>
          <div class="recent-search-list"></div>
          <p class="recent-searches-empty">No recent searches yet.</p>
        </div>
      </section>
    </main>

    <div
      class="modal-overlay save-book-modal"
      id="save-book-modal"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="save-book-title"
    >
      <div class="signin-modal">
        <button
          class="modal-close"
          type="button"
          aria-label="Close add to collection"
          data-save-book-close
        >
          &times;
        </button>
        <h2 id="save-book-title">Add to collection</h2>
        <p class="save-book-name"></p>
        <form class="save-book-form">
          <label for="save-book-collection">Choose a collection</label>
          <select id="save-book-collection" name="collectionId"></select>

          <div class="new-collection-field" hidden>
            <label for="save-book-new-collection">New collection name</label>
            <input
              id="save-book-new-collection"
              name="newCollectionName"
              type="text"
              autocomplete="off"
              placeholder="My favorite books"
            />
          </div>

          <p class="save-book-message" role="status" aria-live="polite"></p>
          <button type="submit">Add book</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
